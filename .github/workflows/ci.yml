name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (minimal)
        run: |
          python -m pip install -U pip
          pip install -e . --no-deps || pip install -e .
          pip install numpy pytest
      - name: Unit tests
        run: pytest -q
      - name: Rebuild synthetic dataset
        run: python scripts/v11/rebuild_synthetic_dataset.py
      - name: Check no absolute home paths in synthetic
        run: |
          if grep -R "/Users/" docs/training/synthetic 2>/dev/null; then
            echo "Absolute /Users paths found in synthetic data" >&2
            exit 1
          fi
          if grep -R "HazyEyes R\|WESCAM\|Foxtrot\|3477022360" eyewalker docs/pwa.html README.md SAFETY.md 2>/dev/null; then
            echo "Disallowed dual-use/personal strings found" >&2
            exit 1
          fi
          echo "OK"
