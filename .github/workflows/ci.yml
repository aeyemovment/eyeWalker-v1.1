name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install numpy pillow pytest
          pip install -e . --no-deps
      - name: Unit tests
        run: PYTHONPATH=. pytest -q
      - name: License contracts exact
        run: PYTHONPATH=. pytest -q tests/test_license_contract.py
      - name: Python source syntax
        run: |
          python -m compileall -q eyewalker scripts tests
          python -m py_compile hf-space-final/app.py meta_submission/app.py
      - name: Rebuild synthetic frames
        run: python scripts/v11/rebuild_synthetic_frames.py
      - name: Synthetic frame fixture contract
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          from PIL import Image

          frames = Path("docs/training/frames")
          expected_names = [f"fixture_{index:04d}.png" for index in range(1, 27)]
          paths = sorted(frames.iterdir(), key=lambda path: (path.name.casefold(), path.name))
          assert [path.name for path in paths] == expected_names
          assert len(paths) == 26

          png_signature = b"\x89PNG\r\n\x1a\n"
          content_hashes = set()
          for path in paths:
              assert not path.is_symlink() and path.is_file(), path
              raw = path.read_bytes()
              assert raw.startswith(png_signature), path
              content_hashes.add(hashlib.sha256(raw).hexdigest())
              with Image.open(path) as image:
                  assert image.format == "PNG", (path, image.format)
                  assert getattr(image, "n_frames", 1) == 1, path
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  assert width >= 640 and height >= 480, (path, image.size)
                  image.load()

          assert len(content_hashes) == 26
          print("synthetic frame contract OK: 26 canonical true PNGs; >=640x480 and unique")
          PY
      - name: Rebuild synthetic dataset
        run: python scripts/v11/rebuild_synthetic_dataset.py
      - name: Synthetic corpus contract and reproducibility
        run: |
          python - <<'PY'
          import collections
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          out = root / "docs/training/synthetic"
          expected_software_version = "1.1.9"
          expected_schema_version = "1.1.0"
          expected_prefix = "SIMULATED RESEARCH CUE:"
          expected_suffix = "Keep your cane or guide dog. Not a medical device."
          expected_direction_contract = (
              "bearing < -8 degrees: step right; bearing > +8 degrees: step left; "
              "bearing in [-8, +8] degrees: HOLD and stop-and-verify"
          )
          manifest = json.loads((out / "dt_ritual_manifest.json").read_text())
          aggregate = [
              json.loads(line)
              for line in (out / "dt_ritual_all.jsonl").read_text().splitlines()
              if line.strip()
          ]
          label_paths = sorted(
              path for path in out.glob("*.json")
              if path.name != "dt_ritual_manifest.json"
          )
          labels = [json.loads(path.read_text()) for path in label_paths]
          identities = {
              (row["source_frame"], row["condition"], row["twin_id"])
              for row in aggregate
          }

          assert (root / "VERSION").read_text() == expected_software_version + "\n"
          assert manifest["software_version"] == expected_software_version
          assert manifest["dataset_schema_version"] == expected_schema_version
          assert manifest["n_frames"] == 26
          assert manifest["n_rows"] == 312
          assert manifest["conditions"] == ["day", "dusk", "night", "rain"]
          assert manifest["twins_per_condition"] == 3
          assert manifest["synthetic_only"] is True
          assert manifest["research_prototype"] is True
          assert manifest["not_medical_device"] is True
          assert manifest["generator_id"] == "eyewalker.synthetic.rebuild.v1"
          assert manifest["path_policy"] == "resolved repo-relative existing sources only"
          assert manifest["safety_cue_contract"] == f"{expected_prefix} ... {expected_suffix}"
          assert manifest["left_right_convention"] == expected_direction_contract
          assert manifest["aggregate_sha256"] == hashlib.sha256(
              (out / "dt_ritual_all.jsonl").read_bytes()
          ).hexdigest()
          assert len(aggregate) == len(labels) == len(label_paths) == 312
          assert len(identities) == 312
          assert len({path.name.casefold() for path in label_paths}) == 312
          assert collections.Counter(
              json.dumps(row, sort_keys=True) for row in aggregate
          ) == collections.Counter(
              json.dumps(label, sort_keys=True) for label in labels
          )

          expected_label_names = set()
          source_frames = set()
          source_records = {}
          centered_rows = 0
          for row in aggregate:
              assert row["condition"] in manifest["conditions"]
              assert type(row["twin_id"]) is int and 0 <= row["twin_id"] < 3
              assert row["dt9"] == {
                  "synthetic_only": True,
                  "research_prototype": True,
                  "not_medical_device": True,
                  "ritual": "all_at_once_v1.1",
              }
              guidance = row["guidance"]
              assert guidance.startswith(expected_prefix + " "), guidance
              assert guidance.endswith(expected_suffix), guidance
              assert guidance.count(expected_prefix) == 1
              assert len(row["obstacles"]) == 1
              obstacle = row["obstacles"][0]
              assert obstacle["simulated"] is True
              assert obstacle["source"] == f"dt_{row['condition']}_t{row['twin_id']}"
              bearing = obstacle["bearing_deg"]
              if bearing < -8:
                  assert "step right." in guidance
              elif bearing > 8:
                  assert "step left." in guidance
              else:
                  centered_rows += 1
                  assert "HOLD and stop and verify." in guidance
                  assert "step side-step" not in guidance

              source = Path(row["source_frame"])
              assert not source.is_absolute()
              assert ".." not in source.parts
              resolved = (root / source).resolve(strict=True)
              assert resolved.is_relative_to(root.resolve())
              assert resolved.is_file(), source
              source_sha256 = hashlib.sha256(resolved.read_bytes()).hexdigest()
              assert row["source_sha256"] == source_sha256
              assert row["provenance"] == {
                  "generator_id": "eyewalker.synthetic.rebuild.v1",
                  "source_sha256": source_sha256,
              }
              source_frames.add(source.as_posix())
              source_records.setdefault(source.as_posix(), source_sha256)
              expected_label_names.add(
                  f"{source.stem}_{row['condition']}_t{row['twin_id']}.json"
              )

          assert len(source_frames) == 26
          assert centered_rows == 96
          assert any(row["obstacles"][0]["bearing_deg"] == -8.0 for row in aggregate)
          assert manifest["source_frames"] == [
              {"path": path, "sha256": sha256}
              for path, sha256 in source_records.items()
          ]
          assert {path.name for path in label_paths} == expected_label_names
          expected_out_paths = expected_label_names | {
              "dt_ritual_all.jsonl",
              "dt_ritual_manifest.json",
          }
          actual_out_paths = {
              path.relative_to(out).as_posix()
              for path in out.rglob("*")
              if path.is_file() or path.is_symlink()
          }
          assert actual_out_paths == expected_out_paths

          untracked = subprocess.check_output(
              [
                  "git", "ls-files", "--others", "-z", "--",
                  "docs/training/frames",
                  "docs/training/synthetic",
                  "docs/training/exports",
              ]
          ).split(b"\0")
          assert not [path for path in untracked if path], untracked
          print(
              "synthetic contract OK: 26 frames / 312 one-to-one records; "
              "exact safety provenance and no extra artifacts"
          )
          PY
          git diff --exit-code -- \
            docs/training/frames \
            docs/training/synthetic \
            docs/training/exports
      - name: Version surfaces aligned
        run: |
          python - <<'PY'
          import ast
          import json
          import re
          import tomllib
          from pathlib import Path

          expected = "1.1.9"
          root = Path.cwd()

          def without_block_comments(source):
              source = re.sub(r"/\*.*?\*/", "", source, flags=re.DOTALL)
              return re.sub(r"<!--.*?-->", "", source, flags=re.DOTALL)

          assert (root / "VERSION").read_text() == expected + "\n"

          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
          assert project["version"] == expected
          assert f"eyeWalker v{expected} —" in project["description"]

          mobile_app_json = json.loads((root / "mobile/app.json").read_text())
          mobile_package = json.loads((root / "mobile/package.json").read_text())
          assert mobile_app_json["expo"]["version"] == expected
          assert mobile_package["version"] == expected
          mobile_app = (root / "mobile/App.tsx").read_text()
          assert re.findall(r"\b\d+\.\d+\.\d+\b", mobile_app) == [expected]

          web_manifest = json.loads((root / "docs/manifest.json").read_text())
          manifest_versions = re.findall(
              r"\bv(\d+\.\d+\.\d+)\b",
              web_manifest["name"],
          )
          assert manifest_versions == [expected], manifest_versions
          docs_index = without_block_comments((root / "docs/index.html").read_text())
          index_versions = re.findall(r"\bv(\d+\.\d+\.\d+)\b", docs_index)
          assert index_versions and set(index_versions) == {expected}, index_versions

          def assigned_version(path):
              tree = ast.parse(path.read_text())
              values = [
                  node.value.value
                  for node in tree.body
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "VERSION" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
              ]
              assert values == [expected], (path, values)

          assigned_version(root / "hf-space-final/app.py")
          assigned_version(root / "meta_submission/app.py")
          for relative in ("hf-space-final/README.md", "meta_submission/README_HF.md"):
              hosted_readme = (root / relative).read_text()
              hosted_versions = re.findall(
                  r"(?m)^(?:title: |# )eyeWalker v(\d+\.\d+\.\d+)\b",
                  hosted_readme,
              )
              assert hosted_versions == [expected, expected], (relative, hosted_versions)

          for relative in ("SAFETY.md", "OPEN_SOURCE.md"):
              text = (root / relative).read_text()
              footer_versions = re.findall(
                  r"eyeWalker \*\*v(\d+\.\d+\.\d+)\*\*",
                  text,
              )
              assert footer_versions == [expected], (relative, footer_versions)

          sw = without_block_comments((root / "docs/service-worker.js").read_text())
          sw_versions = re.findall(
              r'''(?m)^\s*const\s+CACHE\s*=\s*["']eyewalker-v([^"']+)["'];\s*$''',
              sw,
          )
          assert sw_versions == [expected], sw_versions

          pwa = without_block_comments((root / "docs/pwa.html").read_text())
          payload_blocks = re.findall(
              r"(?ms)^\s*const\s+payload\s*=\s*\{(.*?)^\s*\};\s*$",
              pwa,
          )
          assert len(payload_blocks) == 1
          pwa_payload_versions = re.findall(
              r'''(?m)^\s*version:\s*["']([^"']+)["'],\s*$''',
              payload_blocks[0],
          )
          assert pwa_payload_versions == [expected], pwa_payload_versions
          pwa_ready_versions = re.findall(
              r'''(?m)^\s*log\(["']v([^"']+) ready — SIM cues default;''',
              pwa,
          )
          assert pwa_ready_versions == [expected], pwa_ready_versions

          readme = without_block_comments((root / "README.md").read_text())
          badge_versions = re.findall(
              r"shields\.io/badge/version-v([0-9]+\.[0-9]+\.[0-9]+)-blue",
              readme,
          )
          footer_versions = re.findall(
              r"eyeWalker \*\*v([0-9]+\.[0-9]+\.[0-9]+)\*\*",
              readme,
          )
          assert badge_versions == [expected], badge_versions
          assert footer_versions == [expected], footer_versions

          blueprint = (root / "eyewalker/nemoclaw/blueprint.yaml").read_text()
          blueprint_versions = re.findall(r"(?m)^version:\s*([^\s#]+)\s*$", blueprint)
          assert blueprint_versions == [expected], blueprint_versions

          safe_prep = (root / "scripts/v11/Listen-to-me-rant-3.sh").read_text()
          guarded_versions = re.findall(
              r'''(?m)^if \[\[ "\$VERSION_VALUE" != "([^"]+)" \]\]; then\s*$''',
              safe_prep,
          )
          assert guarded_versions == [expected], guarded_versions

          manifest_path = root / "docs/training/synthetic/dt_ritual_manifest.json"
          export_path = root / "docs/training/exports/v1_1_synthetic_manifest.json"
          manifest = json.loads(manifest_path.read_text())
          export = json.loads(export_path.read_text())
          assert manifest["software_version"] == expected
          assert export["software_version"] == expected
          assert manifest == export

          tool = json.loads((root / "meta_submission/llama_stack_tool.json").read_text())
          assert tool["version"] == expected
          print(f"exact operative version surfaces OK: {expected}")
          PY
      - name: No root pwa.html duplicate
        run: test ! -f pwa.html
      - name: Canonical PWA only under docs/
        run: |
          test -f docs/pwa.html
          # no second pwa.html elsewhere in tree
          count=$(find . -name 'pwa.html' -not -path './.git/*' | wc -l | tr -d ' ')
          test "$count" = "1"
      - name: No unsafe ship scripts
        run: |
          # Match executable git lines only (not echo/docs that forbid them)
          if grep -REn '^[[:space:]]*git add -A|^[[:space:]]*git add \.' scripts/ 2>/dev/null; then
            echo "unsafe git add found"; exit 1
          fi
          if grep -REn '^[[:space:]]*git push .*(-f|--force)|git tag -f' scripts/ 2>/dev/null; then
            echo "force push/tag found"; exit 1
          fi
          if find . -name 'Listen-to-me-rant-3.repo.sh' | grep .; then exit 1; fi
          if test -d review_pass_2026-07-26; then echo "review_pass dir must not be public"; exit 1; fi
      - name: Shell scripts parse
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: No aerial dual-use module
        run: |
          test ! -f eyewalker/perception/aerial.py
          if grep -REn 'AerialPerception|["'\'']aerial["'\'']' eyewalker/perception 2>/dev/null; then
            echo "aerial dual-use residue"; exit 1
          fi
      - name: Full tracked-tree privacy and claim scrub
        run: python scripts/check_public_tree.py
      - name: No false anonymize applied claims in perception
        run: |
          if grep -REn '"face_blur": True|"anonymized": True|face_blur=True|anonymized=True' eyewalker/perception 2>/dev/null; then
            echo "use requested/applied honesty flags"; exit 1
          fi
      - name: hybrid L/R step-away unit logic smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          from eyewalker.vlm.hybrid_agent import HybridVLMAgent, HybridConfig, Obstacle
          from eyewalker.planner.avoidance import AvoidancePlanner
          class O:
            def __init__(self,b):
              self.label='x'; self.distance_m=1.0; self.bearing_deg=b
          assert AvoidancePlanner().plan(None,O(-20),None,None)['action']=='step_right'
          assert AvoidancePlanner().plan(None,O(20),None,None)['action']=='step_left'
          a=HybridVLMAgent(HybridConfig(mode='mock'))
          g=a._local_guidance([Obstacle('bin',1.0,-20,'HIGH','simulated_mock')])
          assert 'step right' in g
          g2=a._local_guidance([Obstacle('bin',1.0,20,'HIGH','simulated_mock')])
          assert 'step left' in g2
          print('L/R OK')
          PY
      - name: PWA recorder and consent lifecycle
        run: node tests/pwa_lifecycle_harness.js
