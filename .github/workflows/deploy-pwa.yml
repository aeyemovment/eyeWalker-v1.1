name: Deploy eyeWalker PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build PWA site from docs/
        run: |
          set -euo pipefail
          mkdir -p _site
          # Full docs tree = PWA surface (manifest, SW, icons, pwa.html, index.html)
          rsync -a --exclude 'training/' docs/ _site/
          # Root safety/license for site footer readers
          cp -f SAFETY.md _site/SAFETY.md 2>/dev/null || true
          cp -f PRIVACY.md _site/PRIVACY.md 2>/dev/null || true
          cp -f DUAL_LICENSE.md _site/DUAL_LICENSE.md 2>/dev/null || true
          cp -f OPEN_SOURCE.md _site/OPEN_SOURCE.md 2>/dev/null || true
          # Ensure critical files
          test -f _site/index.html
          test -f _site/pwa.html
          test -f _site/manifest.json
          test -f _site/service-worker.js
          test -f _site/.nojekyll
          ls -la _site
          ls -la _site/icons || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
