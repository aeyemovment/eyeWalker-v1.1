name: eyewalker
version: 1.1.0
description: >
  eyeWalker v1.1 — assistive navigation research prototype (NeuroAgent AI).
  Local-first privacy. Not a medical device.

sandbox:
  base_image: ghcr.io/nvidia/openshell-community/sandboxes/openclaw:0.2.0
  writable:
    - /sandbox
    - /tmp
    - /data
    - /home/eyeWalker
  env:
    EYEWALKER_MODE: assistive
    EYEWALKER_PRIVACY: local-first

network:
  egress:
    allow:
      - api.maptiler.com
      - server.arcgisonline.com
      - "*.openstreetmap.org"
      - overpass-api.de
      - api.openai.com
      - integrate.api.nvidia.com
      - 127.0.0.1:8780  # optional local research loopback only
    deny:
      - "*"
  policy: |
    Prefer map tiles + inference. Location and camera data stay local-first
    unless the user explicitly enables a consented cloud path.

inference:
  provider: nvidia
  model: nvidia/nemotron-3-super-120b-a12b
  fallback:
    - ollama/qwen2-vl:7b
    - ollama/llava:13b
  privacy_router:
    local_first: true
    route_sensitive: local

policies:
  - name: pypi
    type: preset
