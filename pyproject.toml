[project]
name = "eyeWalker"
version = "1.1.9"
description = "eyeWalker v1.1.9 — deterministic simulated accessibility-interface research prototype for visual impairment. Not for navigation; not a medical device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [{ name = "Kemar Green / NeuroAgent AI" }]
keywords = [
  "assistive",
  "accessibility",
  "low-vision",
  "interface-evaluation",
  "research-prototype",
  "neuroagent",
]
dependencies = [
  "numpy",
]

[project.optional-dependencies]
maps = ["osmnx>=2.1,<3"]
synthetic = ["Pillow>=10"]
dev = ["pytest", "black", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/aeyemovment/eyeWalker-v1.1"
Documentation = "https://github.com/aeyemovment/eyeWalker-v1.1#readme"
Repository = "https://github.com/aeyemovment/eyeWalker-v1.1"
Issues = "https://github.com/aeyemovment/eyeWalker-v1.1/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eyewalker*"]
