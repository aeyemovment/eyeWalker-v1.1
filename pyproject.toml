[project]
name = "eyeWalker"
version = "1.1.0"
description = "eyeWalker v1.1 — assistive navigation research prototype for visual impairment (NeuroAgent AI). Not a medical device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [{ name = "Kemar Green / NeuroAgent AI" }]
keywords = [
  "assistive",
  "accessibility",
  "low-vision",
  "navigation",
  "research-prototype",
  "neuroagent",
]
dependencies = [
  "gpxpy",
  "osmnx",
  "numpy",
  "torch",
  "transformers",
  "openai",
  "shapely",
  "pyproj",
]

[project.optional-dependencies]
nemoclaw = ["openshell-cli"]
audio = ["sounddevice", "numpy"]
dev = ["pytest", "black"]

[project.urls]
Homepage = "https://github.com/aeyemovment/eyeWalker"
Documentation = "https://github.com/aeyemovment/eyeWalker#readme"
Repository = "https://github.com/aeyemovment/eyeWalker"
Issues = "https://github.com/aeyemovment/eyeWalker/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eyewalker*"]
